    <!-- Main Body -->
    <main role="main">
      <!-- Login-Registry -->
      <section class="account">
        <section class="account-container">
          <section class="box-account">
            <input
              type="radio"
              id="Login"
              name="tab1"
              class="login-tab"
              checked
            />
            <label for="Login" class="tab">ورود</label>
            <input
              type="radio"
              id="Register"
              name="tab1"
              class="register-tab"
            />
            <label for="Register" class="tab">ثبت نام</label>
            <section class="form">
              <section class="login-form">
                <form action="#" method="post">
                  <div class="group-form">
                    <label for="Username" class="label">نام کاربری</label>
                    <input
                      type="text"
                      id="Username"
                      name="Username"
                      maxlength="15"
                      required
                      autocomplete="off"
                      placeholder="نام کاربری خود را وارد کنید"
                      class="account-input"
                    />
                  </div>
                  <div class="group-form">
                    <label for="Email" class="label">ایمیل</label>
                    <input
                      type="email"
                      id="Email"
                      name="Email"
                      required
                      autocomplete="off"
                      placeholder="ایمیل خود را وارد کنید"
                      class="account-input"
                    />
                  </div>
                  <div class="group-form">
                    <label for="Password" class="label">رمز ورود</label>
                    <input
                      type="password"
                      id="Password"
                      name="Password"
                      required
                      placeholder="رمز ورود خود را وارد کنید"
                      autocomplete="off"
                      class="account-input"
                    />
                  </div>
                  <div class="group-form">
                    <input
                      type="checkbox"
                      id="Remember-check"
                      name="Remember-check"
                    />
                    <label for="Remember-check" class="label"
                      ><span class="check-icon"></span> مرا به خاطر بسپار</label
                    >
                  </div>
                  <div class="group-form">
                    <input type="submit" value="ورود" class="account-button" />
                  </div>
                </form>
                <div class="forget-password">
                  <a href="#">رمز عبور را فراموش کردم</a>
                </div>
              </section>
              <section class="register-form">
                <form action="#" method="post">
                  <div class="group-form">
                    <label for="Signup-username" class="label"
                      >نام کاربری</label
                    >
                    <input
                      type="text"
                      id="Signup-username"
                      name="Signup-username"
                      maxlength="15"
                      required
                      autocomplete="off"
                      placeholder="نام کاربری خود را وارد کنید"
                      class="account-input"
                    />
                  </div>
                  <div class="group-form">
                    <label for="Signup-email" class="label">ایمیل</label>
                    <input
                      type="email"
                      id="Signup-email"
                      name="Signup-email"
                      required
                      autocomplete="off"
                      placeholder="ایمیل خود را وارد کنید"
                      class="account-input"
                    />
                  </div>
                  <div class="group-form">
                    <label for="Signup-password" class="label">رمز ورود</label>
                    <input
                      type="password"
                      id="Signup-password"
                      name="Signup-password"
                      required
                      placeholder="رمز ورود خود را وارد کنید"
                      autocomplete="off"
                      class="account-input"
                    />
                  </div>
                  <div class="group-form">
                    <label for="Confirm-password" class="label"
                      >تایید رمز ورود</label
                    >
                    <input
                      type="password"
                      id="Confirm-password"
                      name="Confirm-password"
                      required
                      placeholder="رمز عبور خود را تایید کنید"
                      autocomplete="off"
                      class="account-input"
                    />
                  </div>
                  <div class="group-form">
                    <input
                      type="submit"
                      value="ثبت نام"
                      class="account-button"
                    />
                  </div>
                </form>
              </section>
            </section>
          </section>
        </section>
      </section>
      <!-- End Login-Registry -->
    </main>
