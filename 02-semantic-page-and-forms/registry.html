<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="در این صفحه اطلاعات وارد شده از سمت کاربران دریافت و به سمت سرور ارسال می شود. در این صفحه برای طراحی از فرمها استفاده شده است."
    />
    <meta
      name="keywords"
      content="ثبت نام، ارسال اطلاعات، فرمها، جداول، HTML"
    />
    <meta name="robots" content="follow, index" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../Exercise.3/image/favicon.5.png" sizes="16x16" />
    <link rel="icon" href="../Exercise.3/image/favicon.6.png" sizes="32x32" />
    <link rel="icon" href="../Exercise.3/image/favicon.7.png" sizes="48x48" />
    <link rel="icon" href="../Exercise.3/image/favicon.8.png" sizes="64x64" />
    <title>ارسال اطلاعات</title>
  </head>
  <body>
    <form action="./server.html" enctype="multipart/form-data" method="post">
      <table style="width: 100%">
        <tr>
          <td>
            <h1>Personal Information</h1>
          </td>
        </tr>
        <tr>
          <td>
            <fieldset>
              <legend style="color: red">Personal Details</legend>
              <label for="Name">Name:</label><br />
              <input
                type="text"
                id="Name"
                name="Name"
                placeholder="Enter name here"
                size="60"
                maxlength="30"
                required
                autocomplete="off"
              /><br /><br />

              <label for="Address">Address:</label><br />
              <textarea
                id="Address"
                name="Address"
                placeholder="Enter address here"
                rows="3"
                cols="52"
                required
                autocomplete="off"
              ></textarea
              ><br /><br />
              <label for="Email">Email:</label><br />
              <input
                type="email"
                id="Email"
                name="Email"
                placeholder="Enter email here"
                size="60"
                autocomplete="off"
              /><br /><br />
              <label for="PhoneNumber">Phone Number:</label><br />
              <input
                type="tel"
                id="PhoneNumber"
                name="PhoneNumber"
                step="1"
                placeholder="Enter 10 digit number"
                required
                style="width: 29%"
                autocomplete="off"
              /><br /><br />
              <p>Gender</p>
              <input
                type="radio"
                id="gender-male"
                name="Gender"
                value="male"
                checked
              />
              <label for="gender-male">Male</label><br />
              <input
                type="radio"
                id="gender-female"
                name="Gender"
                value="female"
              />
              <label for="gender-female">Female</label><br /><br />
              <label for="Birthday">Date of Birth:</label><br />
              <input
                type="date"
                id="Birthday"
                name="Birthday"
                style="width: 436px"
                autocomplete="off"
              />
            </fieldset>
          </td>
        </tr>
        <tr>
          <td>
            <fieldset>
              <label for="Chlang1, Chlang2, Chlang3, Chlang4, Chlang5, Chlang6"
                >Languages and Frameworks known</label
              ><br /><br />
              <input
                type="checkbox"
                id="Chlang1"
                name="Chlang1"
                value="1"
              />JavaScript<br />
              <input
                type="checkbox"
                id="Chlang2"
                name="Chlang2"
                value="2"
              />React<br />
              <input
                type="checkbox"
                id="Chlang3"
                name="Chlang3"
                value="3"
              />C#<br />
              <input
                type="checkbox"
                id="Chlang4"
                name="Chlang4"
                value="4"
                checked
              />c++<br />
              <input
                type="checkbox"
                id="Chlang5"
                name="Chlang5"
                value="5"
                checked
              />PYTHON<br />
              <input
                type="checkbox"
                id="Chlang6"
                name="Chlang6"
                value="6"
                checked
              />Django<br />
            </fieldset>
          </td>
        </tr>
        <tr>
          <td>
            <fieldset>
              <label for="EduLevel">Education Level Completed:</label>
              <select id="EduLevel" name="EduLevel">
                <option value="7">Less than high school</option>
                <option value="8">High school</option>
                <option value="9" selected>University</option>
                <option value="10">Master</option>
                <option value="11">Professional</option>
              </select>
            </fieldset>
          </td>
        </tr>
        <tr>
          <td>
            <fieldset>
              <legend style="color: red">Message Section</legend>
              <label for="Message">Message</label><br /><br />
              <textarea
                id="Message"
                name="Message"
                placeholder="Enter Text Here"
                rows="6"
                cols="50"
                autocomplete="off"
              ></textarea
              ><br />
              <label for="MyFiles">Upload Files:</label><br />
              <input
                type="file"
                id="MyFiles"
                name="MyFiles"
                accept="image/*, .jpg, .pdf, .doc"
                multiple
                style="margin-top: 20px"
              /><br />
              <input
                type="submit"
                value="Send Message"
                style="
                  font-size: 15px;
                  margin-left: 650px;
                  width: 200px;
                  height: 30px;
                  background: black;
                  color: white;
                "
              />
            </fieldset>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
